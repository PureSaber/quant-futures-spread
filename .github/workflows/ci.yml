name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: >-
          ruff format --check qfs_certified tests/test_certified_backtest.py
          tests/test_coverage_factor_strategies.py
          tests/test_coverage_panels_research_utils.py

      - name: Pytest
        run: pytest --cov=. --cov-branch --cov-report=term-missing --cov-fail-under=80 -q
