name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          python -m pip install --no-deps --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: >-
          ruff format --check qfs_certified tests/test_certified_backtest.py
          tests/test_coverage_factor_strategies.py
          tests/test_coverage_panels_research_utils.py

      - name: Pytest
        run: pytest --cov=. --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80 -q

      - name: Enforce certification branch coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          candidates = [
              (key, value) for key, value in report["files"].items()
              if key.replace("\\", "/").endswith("qfs_certified/standard_v2.py")
          ]
          if not candidates:
              raise SystemExit("standard/v2 producer is missing from coverage JSON")
          summary = candidates[0][1]["summary"]
          covered = summary["covered_branches"]
          total = summary["num_branches"]
          if total == 0 or covered / total < 0.90:
              raise SystemExit(f"standard/v2 producer pure branch coverage is {covered}/{total}")
          print(f"standard/v2 producer pure branches: {covered}/{total}={covered / total:.2%}")
          PY
