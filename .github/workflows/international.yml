name: international research
on: [push, pull_request]
permissions:
  contents: read
jobs:
  international:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: international
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest --cov=qfs_global --cov-branch --cov-fail-under=80 -q
      - run: python -m quant_data_kit.derivatives.cli demo --kind future --output demo-bundle
      - run: python -m qfs_global.cli preflight --bundle demo-bundle --config examples/demo.json
      - run: python -m qfs_global.cli run --bundle demo-bundle --config examples/demo.json --output demo-result
      - run: python -m qfs_global.cli verify --output demo-result
