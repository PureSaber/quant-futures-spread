[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-futures-spread"
version = "0.2.0"
description = "Chinese commodity futures spread backtest and factor research engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "numba>=0.58",
    "PyYAML>=6.0",
    "xlsxwriter>=3.0",
    "openpyxl>=3.1",
    "sortedcontainers>=2.4",
    "pyarrow>=14.0",
    "quant-data-kit @ git+https://github.com/PureSaber/quant-data-kit.git@v0.5.0",
    "quant-execution @ git+https://github.com/PureSaber/quant-execution.git@v0.2.0",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@v0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9.0"]

[project.scripts]
qfs-backtest = "run_backtest:main"
qfs-certified-backtest = "qfs_certified.runner:main"

[tool.setuptools]
py-modules = ["run_backtest", "performance"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backtest*",
    "core*",
    "data_sources*",
    "performance*",
    "qfs_certified*",
    "research*",
    "strategy*",
    "utils*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --basetemp=.pytest-tmp -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "output",
    "tools/_cache",
    "config/_generated",
    "tools",
    "strategy/strategies/boll_grid",
    "strategy/strategies/gaozong2",
    "strategy/strategies/gaozong2_spread",
    "strategy/strategies/haoyuxiangv3",
    "strategy/strategies/tangye2",
    "strategy/strategies/tangye2_spread",
    "strategy/strategies/wangzhihao",
    "strategy/strategies/xuhe",
    "strategy/strategies/zhouhaotian",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "E731"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
