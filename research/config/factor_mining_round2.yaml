# Round 2：成本感知因子筛选（基于 fwd_realized_long IC）
round_id: round_2
mode: full

data:
  data_dir: D:/data
  cross_dir: D:/data/跨品种
  dom_table_dir: D:/data/商品期货-主力合约
  years: ["2024", "2025"]

universe:
  calendar_products: []
  cross_pairs: []
  max_spreads_per_product: 0

labels:
  horizons_min: [5, 15, 60, 240]

factors:
  lookback: 60
  vol_short: 20
  vol_long: 120

filters:
  require_trade: true
  max_eff_spread_ticks: 50

output:
  dir: research/output

selection:
  # 中间价 IC 阈值（参考）
  min_abs_ic: 0.03
  min_icir: 0.5
  # 可实现 IC 阈值（Round2 主筛选用）
  min_abs_realized_ic: 0.02
  min_realized_icir: 0.4
  # 与 z_close 冗余剔除：|corr| > 此值的因子不入选
  max_corr_with_z_close: 0.95
